<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PitchPilot AI HUD</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  button {
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    color: #f8fafc;
    overflow: hidden;
    pointer-events: auto;
  }

  .hud-shell {
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(14px);
    pointer-events: auto;
  }

  .hud-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    -webkit-app-region: drag;
    cursor: move;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.2px;
    color: #f8fafc;
  }

  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;
  }

  .brand-dot.listening {
    background: #22c55e;
    box-shadow: 0 0 10px #22c55e;
  }

  .brand-dot.error {
    background: #ef4444;
    box-shadow: 0 0 10px #ef4444;
  }

  .win-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }

  .win-btn {
    width: 26px;
    height: 24px;
    border-radius: 6px;
    border: 1px solid rgba(148, 163, 184, 0.22);
    background: rgba(30, 41, 59, 0.85);
    color: #e2e8f0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }

  .win-btn:hover {
    background: rgba(51, 65, 85, 0.95);
    color: #ffffff;
  }

  .win-btn.close:hover {
    background: #ef4444;
    border-color: #ef4444;
    color: #ffffff;
  }

  .api-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    background: rgba(15, 23, 42, 0.65);
    border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }

  .api-bar input {
    flex: 1;
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 6px;
    padding: 5px 8px;
    color: #f8fafc;
    font-size: 11px;
    outline: none;
    user-select: text;
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }

  .api-bar input:focus {
    border-color: #38bdf8;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }

  .btn {
    border: 1px solid rgba(148, 163, 184, 0.25);
    background: rgba(30, 41, 59, 0.92);
    color: #f8fafc;
    padding: 6px 11px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }

  .btn:hover {
    background: rgba(51, 65, 85, 0.95);
  }

  .btn.primary {
    background: #2563eb;
    border-color: #3b82f6;
    color: #ffffff;
  }

  .btn.primary:hover {
    background: #1d4ed8;
  }

  .btn.active {
    background: #16a34a;
    border-color: #22c55e;
    color: #ffffff;
  }

  .btn.small {
    padding: 4px 8px;
    font-size: 11px;
  }

  .manual-row {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }

  .manual-row input {
    flex: 1;
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 8px;
    padding: 6px 10px;
    color: #f8fafc;
    font-size: 12px;
    outline: none;
    user-select: text;
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }

  .manual-row input:focus {
    border-color: #38bdf8;
  }

  .content {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    user-select: text;
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }

  .heard-box {
    background: rgba(30, 41, 59, 0.72);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    color: #cbd5e1;
    line-height: 1.4;
  }

  .heard-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: #38bdf8;
    margin-bottom: 3px;
  }

  .answer-box {
    flex: 1;
    background: rgba(15, 23, 42, 0.65);
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 13px;
    line-height: 1.55;
    color: #f1f5f9;
    white-space: pre-wrap;
    overflow-y: auto;
  }

  .footer {
    padding: 7px 12px;
    border-top: 1px solid rgba(148, 163, 184, 0.14);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: #94a3b8;
  }
</style>
</head>
<body>
<div class="hud-shell" id="hudShell">
  <div class="hud-header">
    <div class="brand">
      <span class="brand-dot" id="statusDot"></span>
      <span>PitchPilot AI Copilot</span>
    </div>
    <div class="win-controls">
      <button type="button" class="win-btn" id="opacityBtn" title="Toggle Opacity">◐</button>
      <button type="button" class="win-btn" id="minBtn" title="Hide to Tray">—</button>
      <button type="button" class="win-btn close" id="closeBtn" title="Quit App">✕</button>
    </div>
  </div>

  <div class="api-bar">
    <input type="url" id="apiBaseInput" placeholder="Paste your deployment URL" />
    <button type="button" class="btn small" id="saveApiBtn">Save URL</button>
  </div>

  <div class="toolbar">
    <button type="button" class="btn primary" id="listenBtn">🎤 Listen</button>
    <button type="button" class="btn" id="flushBtn" title="Send buffered question now">⚡ Ask Now</button>
    <button type="button" class="btn" id="clearBtn">Clear</button>
  </div>

  <div class="manual-row">
    <input type="text" id="questionInput" placeholder="Type or edit interview question and press Enter..." />
    <button type="button" class="btn primary" id="askBtn">Ask AI</button>
  </div>

  <div class="content">
    <div class="heard-box">
      <div class="heard-label">Live Transcript</div>
      <div id="heardText">Waiting for audio or typed question…</div>
    </div>
    <div class="answer-box" id="answerText">Click 🎤 Listen to capture system interview audio, or type a question above.</div>
  </div>

  <div class="footer">
    <span id="statusText">Ready</span>
    <span id="apiStatusText">No URL set</span>
  </div>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const hudShell = document.getElementById("hudShell");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const apiStatusText = document.getElementById("apiStatusText");
  const apiBaseInput = document.getElementById("apiBaseInput");
  const saveApiBtn = document.getElementById("saveApiBtn");
  const opacityBtn = document.getElementById("opacityBtn");
  const minBtn = document.getElementById("minBtn");
  const closeBtn = document.getElementById("closeBtn");
  const listenBtn = document.getElementById("listenBtn");
  const flushBtn = document.getElementById("flushBtn");
  const clearBtn = document.getElementById("clearBtn");
  const questionInput = document.getElementById("questionInput");
  const askBtn = document.getElementById("askBtn");
  const heardText = document.getElementById("heardText");
  const answerText = document.getElementById("answerText");

  const opacities = [0.94, 0.80, 0.64];
  let opacityIndex = 0;

  let sessionContext = {
    apiBase: (localStorage.getItem("pitchpilot_api_base") || "").trim(),
    token: localStorage.getItem("pitchpilot_token") || "",
    resumeText: "",
    jobDescription: ""
  };

  function normalizeUrl(raw) {
    const trimmed = (raw || "").trim().replace(/\/+$/, "");
    if (!trimmed) return "";
    if (/^https?:\/\//i.test(trimmed)) return trimmed;
    return "https://" + trimmed;
  }

  function updateApiDisplay() {
    if (sessionContext.apiBase) {
      apiBaseInput.value = sessionContext.apiBase;
      apiStatusText.textContent = sessionContext.apiBase.replace(/^https?:\/\//, "");
    } else {
      apiStatusText.textContent = "Set Vercel URL above";
    }
  }

  updateApiDisplay();

  function setStatus(msg, mode = "idle") {
    statusText.textContent = msg;
    statusDot.classList.remove("listening", "error");
    if (mode === "listening") statusDot.classList.add("listening");
    if (mode === "error") statusDot.classList.add("error");
  }

  // Sync context and the configured API URL from the local bridge.
  if (window.stealthHUD && typeof window.stealthHUD.onPayload === "function") {
    window.stealthHUD.onPayload((ctx) => {
      if (!ctx) return;
      if (ctx.apiBase) {
        sessionContext.apiBase = normalizeUrl(ctx.apiBase);
        localStorage.setItem("pitchpilot_api_base", sessionContext.apiBase);
      }
      if (ctx.token) {
        sessionContext.token = ctx.token;
        localStorage.setItem("pitchpilot_token", ctx.token);
      }
      if (ctx.resumeText !== undefined) sessionContext.resumeText = ctx.resumeText;
      if (ctx.jobDescription !== undefined) sessionContext.jobDescription = ctx.jobDescription;
      updateApiDisplay();
    });
  }

  saveApiBtn.addEventListener("click", () => {
    const clean = normalizeUrl(apiBaseInput.value);
    sessionContext.apiBase = clean;
    localStorage.setItem("pitchpilot_api_base", clean);
    updateApiDisplay();
    setStatus(clean ? "Backend URL saved" : "Cleared URL", "idle");
  });

  opacityBtn.addEventListener("click", () => {
    opacityIndex = (opacityIndex + 1) % opacities.length;
    hudShell.style.background = `rgba(15, 23, 42, ${opacities[opacityIndex]})`;
  });

  minBtn.addEventListener("click", () => {
    if (window.stealthHUD && typeof window.stealthHUD.toggleVisibility === "function") {
      window.stealthHUD.toggleVisibility();
    } else {
      window.blur();
    }
  });

  closeBtn.addEventListener("click", () => {
    stopListening();
    if (window.stealthHUD && typeof window.stealthHUD.quitApp === "function") {
      window.stealthHUD.quitApp();
    } else {
      window.close();
    }
  });

  clearBtn.addEventListener("click", () => {
    accumulatedSegments = [];
    clearTimeout(stitchTimer);
    heardText.textContent = "Waiting for audio or typed question…";
    answerText.textContent = "Cleared.";
    questionInput.value = "";
    setStatus("Cleared", "idle");
  });

  // --- Audio Capture & Multi-Clause Question Stitching ---
  let isListening = false;
  let mediaStream = null;
  let audioContext = null;
  let scriptProcessor = null;
  let pcmChunks = [];
  let pcmSampleCount = 0;
  let speechActive = false;
  let speechStartTime = 0;
  let lastSpeechTime = 0;
  let noiseFloorRms = 0.002;

  let accumulatedSegments = [];
  let stitchTimer = null;
  let activeAnswerController = null;
  let transcriptionQueue = Promise.resolve();

  const TARGET_SAMPLE_RATE = 12000;
  const PAUSE_FLUSH_MS = 950;
  const HARD_MAX_PHRASE_MS = 6500;
  const MAX_PHRASE_SAMPLES = Math.floor(TARGET_SAMPLE_RATE * HARD_MAX_PHRASE_MS / 1000);
  const MIN_SPEECH_MS = 350;

  function looksIncompleteClause(text) {
    const clean = text.trim().toLowerCase().replace(/[?!.,]+$/, "");
    if (!clean) return false;
    const words = clean.split(/\s+/);
    if (words.length <= 4) return true;
    const trailingConnectors = [
      "and", "or", "but", "of", "to", "in", "for", "with", "between",
      "about", "versus", "vs", "what", "how", "why", "when", "which",
      "advantages", "disadvantages", "difference", "differences", "benefits"
    ];
    const lastWord = words[words.length - 1];
    return trailingConnectors.includes(lastWord);
  }

  function joinSegments(segments) {
    return segments
      .map((seg, idx) => {
        let s = seg.trim();
        if (idx < segments.length - 1) {
          s = s.replace(/[?]+$/g, "");
        }
        return s;
      })
      .filter(Boolean)
      .join(" ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function scheduleQuestionDispatch() {
    clearTimeout(stitchTimer);
    const combined = joinSegments(accumulatedSegments);
    if (!combined) return;

    const incomplete = looksIncompleteClause(combined);
    const displayedQuestion = incomplete ? combined.replace(/\?+$/, "") : combined;
    heardText.textContent = displayedQuestion;
    questionInput.value = displayedQuestion;

    const waitMs = incomplete ? 1650 : 650;
    setStatus(`Stitching (${waitMs}ms)…`, "listening");

    stitchTimer = setTimeout(() => {
      const finalPrompt = joinSegments(accumulatedSegments);
      accumulatedSegments = [];
      if (finalPrompt) {
        askCopilot(finalPrompt);
      }
    }, waitMs);
  }

  flushBtn.addEventListener("click", () => {
    clearTimeout(stitchTimer);
    if (speechActive && pcmSampleCount > 0) {
      flushAudioBuffer("manual");
    }
    const finalPrompt = joinSegments(accumulatedSegments) || questionInput.value.trim();
    accumulatedSegments = [];
    if (finalPrompt) {
      askCopilot(finalPrompt);
    }
  });

  function downsampleTo12k(float32Array, inputSampleRate) {
    if (inputSampleRate === TARGET_SAMPLE_RATE) return float32Array;
    const ratio = inputSampleRate / TARGET_SAMPLE_RATE;
    const newLength = Math.round(float32Array.length / ratio);
    const result = new Float32Array(newLength);
    let offsetResult = 0;
    let offsetBuffer = 0;
    while (offsetResult < result.length) {
      const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
      let accum = 0;
      let count = 0;
      for (let i = offsetBuffer; i < nextOffsetBuffer && i < float32Array.length; i++) {
        accum += float32Array[i];
        count++;
      }
      result[offsetResult] = count > 0 ? accum / count : 0;
      offsetResult++;
      offsetBuffer = nextOffsetBuffer;
    }
    return result;
  }

  function encodeWav(samples, sampleRate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    function writeString(offset, str) {
      for (let i = 0; i < str.length; i++) {
        view.setUint8(offset + i, str.charCodeAt(i));
      }
    }

    writeString(0, "RIFF");
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(8, "WAVE");
    writeString(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, "data");
    view.setUint32(40, samples.length * 2, true);

    let offset = 44;
    for (let i = 0; i < samples.length; i++, offset += 2) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Blob([buffer], { type: "audio/wav" });
  }

  async function flushAudioBuffer(reason) {
    if (pcmSampleCount === 0) return;
    const totalSamples = pcmSampleCount;
    const chunks = pcmChunks;
    pcmChunks = [];
    pcmSampleCount = 0;
    speechActive = false;

    const durationMs = (totalSamples / TARGET_SAMPLE_RATE) * 1000;
    if (durationMs < MIN_SPEECH_MS) return;

    const merged = new Float32Array(totalSamples);
    let offset = 0;
    for (const c of chunks) {
      merged.set(c, offset);
      offset += c.length;
    }

    const wavBlob = encodeWav(merged, TARGET_SAMPLE_RATE);
    await transcribeChunk(wavBlob, reason);
  }

  async function transcribeChunk(wavBlob) {
    const apiBase = normalizeUrl(sessionContext.apiBase || apiBaseInput.value);
    if (!apiBase) {
      setStatus("Enter your Vercel URL at top first", "error");
      return;
    }
    transcriptionQueue = transcriptionQueue.then(async () => {
      const t0 = performance.now();
      const kb = Math.max(1, Math.round(wavBlob.size / 1024));
      setStatus(`Transcribing (${kb} KB)…`, "listening");

      try {
        const formData = new FormData();
        formData.append("audio", wavBlob, "speech.wav");

        const headers = {};
        if (sessionContext.token) {
          headers["Authorization"] = `Bearer ${sessionContext.token}`;
        }

        const res = await fetch(`${apiBase}/api/copilot/transcribe`, {
          method: "POST",
          headers,
          body: formData
        });

        if (!res.ok) {
          throw new Error(`Transcribe HTTP ${res.status}`);
        }

        const data = await res.json();
        const transcript = (data.text || data.transcript || "").trim();
        const elapsed = Math.round(performance.now() - t0);

        if (transcript && transcript.length > 1) {
          accumulatedSegments.push(
            looksIncompleteClause(transcript) ? transcript.replace(/\?+$/, "") : transcript
          );
          setStatus(`Heard (${elapsed}ms)`, "listening");
          scheduleQuestionDispatch();
        } else {
          setStatus("Listening…", "listening");
        }
      } catch (err) {
        setStatus(`Transcribe error: ${err.message}`, "error");
      }
    });
    await transcriptionQueue;
  }

  function appendAudioSamples(samples) {
    const remaining = MAX_PHRASE_SAMPLES - pcmSampleCount;
    if (remaining <= 0) {
      flushAudioBuffer("max-cap");
      return;
    }

    const acceptedSamples = samples.subarray(0, remaining);
    if (acceptedSamples.length > 0) {
      pcmChunks.push(acceptedSamples);
      pcmSampleCount += acceptedSamples.length;
    }
    if (pcmSampleCount >= MAX_PHRASE_SAMPLES) {
      flushAudioBuffer("max-cap");
    }
  }

  async function startListening() {
    const apiBase = normalizeUrl(sessionContext.apiBase || apiBaseInput.value);
    if (!apiBase) {
      setStatus("Paste your Vercel URL & click Save first", "error");
      apiBaseInput.focus();
      return;
    }

    try {
      setStatus("Requesting system audio…", "listening");
      mediaStream = await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

      const audioTracks = mediaStream.getAudioTracks();
      if (!audioTracks || audioTracks.length === 0) {
        throw new Error("No system audio track shared");
      }

      // Stop unnecessary video track immediately to save CPU
      mediaStream.getVideoTracks().forEach((t) => t.stop());

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioContext.createMediaStreamSource(new MediaStream(audioTracks));
      scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

      scriptProcessor.onaudioprocess = (event) => {
        if (!isListening) return;
        const input = event.inputBuffer.getChannelData(0);
        const downsampled = downsampleTo12k(input, audioContext.sampleRate);

        let sumSq = 0;
        for (let i = 0; i < downsampled.length; i++) {
          sumSq += downsampled[i] * downsampled[i];
        }
        const rms = Math.sqrt(sumSq / downsampled.length);
        const now = Date.now();

        if (speechActive && now - speechStartTime >= HARD_MAX_PHRASE_MS) {
          flushAudioBuffer("max-cap");
        }

        if (!speechActive) {
          noiseFloorRms = noiseFloorRms * 0.95 + rms * 0.05;
        }
        const threshold = Math.max(0.0032, noiseFloorRms * 2.1);

        if (rms > threshold) {
          if (!speechActive) {
            speechActive = true;
            speechStartTime = now;
            setStatus("Speech detected…", "listening");
          }
          lastSpeechTime = now;
          appendAudioSamples(downsampled);
        } else if (speechActive) {
          appendAudioSamples(downsampled);
          if (now - lastSpeechTime >= PAUSE_FLUSH_MS) {
            flushAudioBuffer("pause");
          }
        }
      };

      source.connect(scriptProcessor);
      scriptProcessor.connect(audioContext.destination);

      isListening = true;
      listenBtn.textContent = "⏹ Stop";
      listenBtn.classList.remove("primary");
      listenBtn.classList.add("active");
      setStatus("Listening to system audio…", "listening");
    } catch (err) {
      stopListening();
      setStatus(`Audio error: ${err.message}`, "error");
    }
  }

  function stopListening() {
    isListening = false;
    speechActive = false;
    pcmChunks = [];
    pcmSampleCount = 0;
    if (scriptProcessor) {
      try { scriptProcessor.disconnect(); } catch (e) {}
      scriptProcessor = null;
    }
    if (audioContext) {
      try { audioContext.close(); } catch (e) {}
      audioContext = null;
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach((t) => t.stop());
      mediaStream = null;
    }
    listenBtn.textContent = "🎤 Listen";
    listenBtn.classList.remove("active");
    listenBtn.classList.add("primary");
    setStatus("Stopped", "idle");
  }

  listenBtn.addEventListener("click", () => {
    if (isListening) {
      stopListening();
    } else {
      startListening();
    }
  });

  async function askCopilot(question) {
    const cleanQ = (question || "").trim();
    if (!cleanQ) return;

    const apiBase = normalizeUrl(sessionContext.apiBase || apiBaseInput.value);
    if (!apiBase) {
      setStatus("Paste your Vercel URL & click Save first", "error");
      apiBaseInput.focus();
      return;
    }

    if (activeAnswerController) {
      activeAnswerController.abort();
    }
    activeAnswerController = new AbortController();

    heardText.textContent = cleanQ;
    answerText.textContent = "Generating answer…";
    const t0 = performance.now();
    setStatus("Thinking…", "listening");

    try {
      const headers = { "Content-Type": "application/json" };
      if (sessionContext.token) {
        headers["Authorization"] = `Bearer ${sessionContext.token}`;
      }

      const res = await fetch(`${apiBase}/api/copilot/answer`, {
        method: "POST",
        headers,
        signal: activeAnswerController.signal,
        body: JSON.stringify({
          question: cleanQ,
          resumeText: sessionContext.resumeText || "",
          jobDescription: sessionContext.jobDescription || "",
          stream: true
        })
      });

      if (!res.ok) {
        throw new Error(`Answer HTTP ${res.status}`);
      }

      const contentType = res.headers.get("content-type") || "";
      if (res.body && !contentType.includes("application/json")) {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let fullText = "";
        let firstChunkMs = 0;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (!firstChunkMs) {
            firstChunkMs = Math.round(performance.now() - t0);
            setStatus(`Streaming (${firstChunkMs}ms)…`, isListening ? "listening" : "idle");
          }
          fullText += decoder.decode(value, { stream: true });
          answerText.textContent = fullText;
        }
        fullText += decoder.decode();
        answerText.textContent = fullText;
        const elapsed = Math.round(performance.now() - t0);
        setStatus(isListening ? "Listening…" : `Done (${elapsed}ms)`, isListening ? "listening" : "idle");
      } else {
        const data = await res.json();
        const totalMs = Math.round(performance.now() - t0);
        const sections = [
          data.overview,
          data.starStory ? `### STAR Example\n${data.starStory}` : "",
          Array.isArray(data.bullets) && data.bullets.length
            ? `### Key Talking Points\n${data.bullets.map((bullet) => `- ${bullet}`).join("\n")}`
            : ""
        ].filter(Boolean);
        answerText.textContent = data.answer || data.text || sections.join("\n\n") || JSON.stringify(data, null, 2);
        setStatus(isListening ? "Listening…" : `Done (${totalMs}ms)`, isListening ? "listening" : "idle");
      }
    } catch (err) {
      if (err.name === "AbortError") return;
      answerText.textContent = `Error: ${err.message}`;
      setStatus(`Error: ${err.message}`, "error");
    }
  }

  askBtn.addEventListener("click", () => {
    clearTimeout(stitchTimer);
    accumulatedSegments = [];
    askCopilot(questionInput.value);
  });

  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      clearTimeout(stitchTimer);
      accumulatedSegments = [];
      askCopilot(questionInput.value);
    }
  });
});
</script>
</body>
</html>
