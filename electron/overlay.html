<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PitchPilot Stealth HUD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-alpha: 0.9;
      --bg-color: rgba(10, 15, 28, var(--bg-alpha));
      --card-bg: rgba(30, 41, 59, 0.55);
      --border-color: rgba(56, 189, 248, 0.28);
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --answer-font-size: 13px;
    }
    body.vscode-mode {
      --bg-color: rgba(30, 30, 30, var(--bg-alpha));
      --card-bg: rgba(37, 37, 38, 0.8);
      --border-color: rgba(86, 156, 214, 0.35);
      --accent: #569cd6;
      --text-main: #d4d4d4;
      --text-muted: #858585;
      font-family: "Consolas", "Courier New", monospace;
    }
    body {
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(12px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .header {
      -webkit-app-region: drag;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      gap: 6px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .header-left span#hudTitle {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .live-dot {
      flex-shrink: 0;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .header-actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .close-btn {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .close-btn:hover {
      background: #dc2626;
      color: #fff;
    }
    .controls {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .btn {
      background: rgba(30, 41, 59, 0.9);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .btn.primary:hover { background: #0369a1; }
    .btn.listening {
      background: #dc2626;
      border-color: #f87171;
      animation: pulseRed 1.5s infinite;
    }
    @keyframes pulseRed {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 0 5px rgba(239, 68, 68, 0); }
    }
    input {
      flex: 1;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 8px;
      color: #fff;
      padding: 7px 10px;
      font-size: 12px;
      min-width: 0;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding: 0 2px;
      gap: 8px;
    }
    .answer-pane {
      flex: 1;
      overflow-y: auto;
      font-size: var(--answer-font-size);
      line-height: 1.55;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .answer-pane::-webkit-scrollbar { width: 5px; }
    .answer-pane::-webkit-scrollbar-track { background: transparent; }
    .answer-pane::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .star-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }
    .star-badge {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      font-weight: 700;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    pre {
      background: #020617;
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 9px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: "Consolas", monospace;
      font-size: calc(var(--answer-font-size) - 1px);
      color: #e2e8f0;
    }
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 28px 14px;
      border: 1px dashed rgba(148, 163, 184, 0.2);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <span class="live-dot"></span>
      <span id="hudTitle">PitchPilot HUD</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="fontDownBtn" title="Decrease Font Size">A-</button>
      <button class="icon-btn" id="fontUpBtn" title="Increase Font Size">A+</button>
      <button class="icon-btn" id="sizeBtn" title="Toggle Compact / Wide Window">Wide</button>
      <button class="icon-btn" id="opacityBtn" title="Cycle Opacity">◐ 90%</button>
      <button class="icon-btn" id="themeBtn" title="Toggle VS Code Disguise">VS</button>
      <button class="icon-btn" id="clearBtn" title="Clear Answer">Clear</button>
      <button class="close-btn" id="closeHudBtn" title="Quit Stealth HUD">✕</button>
    </div>
  </div>

  <div class="controls">
    <button id="listenBtn" class="btn">🎤 Listen</button>
    <input id="promptInput" placeholder="Ask or capture live question..." />
    <button id="askBtn" class="btn primary">Ask AI</button>
  </div>

  <div class="status-bar">
    <span id="statusText">Ready — Sync JD & CV from Add-in</span>
    <span id="shortcutHint">Ctrl+Shift+H Hide • Ctrl+Alt+Arrows Move</span>
  </div>

  <div class="answer-pane" id="answerBox">
    <div class="empty-state">
      Tailored summaries, STAR stories, and code solutions will appear here invisibly during your call.
    </div>
  </div>

  <script>
    let context = JSON.parse(localStorage.getItem('pp_stealth_ctx') || '{}');
    let isListening = false;
    let mediaStream = null;
    let recordLoopActive = false;
    let accumulatedQuestion = '';
    let silenceCount = 0;

    const opacities = [0.9, 0.72, 0.5];
    let opacityIdx = 0;
    let isWide = false;

    let fontSize = Number(localStorage.getItem('pp_hud_font_size')) || 13;
    document.documentElement.style.setProperty('--answer-font-size', `${fontSize}px`);

    if (context.apiToken) {
      document.getElementById('statusText').textContent = 'JD & CV Context Synced ✅';
    }

    document.getElementById('fontDownBtn').addEventListener('click', () => {
      fontSize = Math.max(11, fontSize - 1);
      document.documentElement.style.setProperty('--answer-font-size', `${fontSize}px`);
      localStorage.setItem('pp_hud_font_size', String(fontSize));
    });

    document.getElementById('fontUpBtn').addEventListener('click', () => {
      fontSize = Math.min(18, fontSize + 1);
      document.documentElement.style.setProperty('--answer-font-size', `${fontSize}px`);
      localStorage.setItem('pp_hud_font_size', String(fontSize));
    });

    document.getElementById('sizeBtn').addEventListener('click', () => {
      isWide = !isWide;
      document.getElementById('sizeBtn').textContent = isWide ? 'Compact' : 'Wide';
      if (window.stealthAPI?.resizeWindow) {
        window.stealthAPI.resizeWindow(isWide ? 640 : 440, isWide ? 680 : 580);
      }
    });

    document.getElementById('opacityBtn').addEventListener('click', () => {
      opacityIdx = (opacityIdx + 1) % opacities.length;
      const val = opacities[opacityIdx];
      document.documentElement.style.setProperty('--bg-alpha', String(val));
      document.getElementById('opacityBtn').textContent = `◐ ${Math.round(val * 100)}%`;
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      const isVs = document.body.classList.toggle('vscode-mode');
      document.getElementById('hudTitle').textContent = isVs ? 'notes.md — VS Code' : 'PitchPilot HUD';
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('promptInput').value = '';
      document.getElementById('answerBox').innerHTML =
        '<div class="empty-state">Cleared. Ready for the next question.</div>';
    });

    document.getElementById('closeHudBtn').addEventListener('click', () => {
      if (window.stealthAPI?.quitApp) window.stealthAPI.quitApp();
      else window.close();
    });

    window.stealthAPI?.onSyncContext((data) => {
      context = { ...context, ...data };
      localStorage.setItem('pp_stealth_ctx', JSON.stringify(context));
      document.getElementById('statusText').textContent = 'JD & CV Synced from Add-in ✅';
    });

    window.stealthAPI?.onNewPrompt((data) => {
      if (data.question) document.getElementById('promptInput').value = data.question;
      if (data.html) document.getElementById('answerBox').innerHTML = `<div class="card">${data.html}</div>`;
    });

    window.stealthAPI?.onClickThrough((locked) => {
      document.getElementById('shortcutHint').textContent = locked
        ? '🔒 Click-Through ON (Ctrl+Shift+T)'
        : 'Ctrl+Shift+H Hide • Ctrl+Alt+Arrows Move';
    });

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function askCopilot(question) {
      if (!question || !question.trim()) return;
      const answerBox = document.getElementById('answerBox');
      answerBox.innerHTML = '<div class="card" style="color:#38bdf8;">✨ Generating tailored response…</div>';

      const origin = (context.apiOrigin || 'https://pitchpilot-ai-ruddy.vercel.app').replace(/\/+$/, '');
      try {
        const res = await fetch(`${origin}/api/copilot/answer`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(context.apiToken ? { Authorization: `Bearer ${context.apiToken}` } : {}),
          },
          body: JSON.stringify({
            question: question.trim(),
            mode: context.mode || 'INTERVIEW',
            contextText: context.contextText || '',
            documentIds: context.documentIds || [],
          }),
        });
        const json = await res.json();
        const d = json.data || json;
        if (json.error) throw new Error(json.error);

        let html = `<div class="card">
          <div class="card-title" style="color:#38bdf8;">💡 Overview / Key Answer</div>
          <div>${escapeHtml(d.summary || 'No response.')}</div>
        </div>`;

        if (d.starAnswer && (d.starAnswer.situation || d.starAnswer.task)) {
          html += `<div class="card">
            <div class="card-title" style="color:#4ade80;">⭐ STAR Story</div>
            <div class="star-row"><span class="star-badge">S</span><span>${escapeHtml(d.starAnswer.situation)}</span></div>
            <div class="star-row"><span class="star-badge">T</span><span>${escapeHtml(d.starAnswer.task)}</span></div>
            <div class="star-row"><span class="star-badge">A</span><span>${escapeHtml(d.starAnswer.action)}</span></div>
            <div class="star-row"><span class="star-badge">R</span><span>${escapeHtml(d.starAnswer.result)}</span></div>
          </div>`;
        }

        if (d.codingSolution && d.codingSolution.code) {
          const codeId = 'code-' + Date.now();
          html += `<div class="card">
            <div class="card-title" style="color:#c084fc;">
              <span>💻 ${escapeHtml(d.codingSolution.language || 'Code Solution')}</span>
              <button class="icon-btn" onclick="navigator.clipboard.writeText(document.getElementById('${codeId}').innerText)">Copy</button>
            </div>
            <pre><code id="${codeId}">${escapeHtml(d.codingSolution.code)}</code></pre>
            <div style="font-size:11px;color:#94a3b8;margin-top:6px;">Time: ${escapeHtml(d.codingSolution.timeComplexity || 'O(n)')} • Space: ${escapeHtml(d.codingSolution.spaceComplexity || 'O(1)')}</div>
          </div>`;
        }

        if (d.suggestedPhrases && d.suggestedPhrases.length > 0) {
          html += `<div class="card">
            <div class="card-title" style="color:#fbbf24;">💬 Speaking Points</div>
            <ul style="margin-left:16px;display:grid;gap:4px;">
              ${d.suggestedPhrases.map((p) => `<li>"${escapeHtml(p)}"</li>`).join('')}
            </ul>
          </div>`;
        }

        answerBox.innerHTML = html;
      } catch (err) {
        answerBox.innerHTML = `<div class="card" style="color:#f87171;">Error: ${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById('askBtn').addEventListener('click', () => {
      askCopilot(document.getElementById('promptInput').value);
    });

    document.getElementById('promptInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') askCopilot(document.getElementById('promptInput').value);
    });

    async function transcribeChunk(blob) {
      const origin = (context.apiOrigin || 'https://pitchpilot-ai-ruddy.vercel.app').replace(/\/+$/, '');
      const formData = new FormData();
      formData.append('audio', blob, 'chunk.webm');
      const res = await fetch(`${origin}/api/copilot/transcribe`, { method: 'POST', body: formData });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return (data.text || '').trim();
    }

    function recordOneChunk(stream, durationMs) {
      return new Promise((resolve) => {
        const chunks = [];
        const recorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => resolve(new Blob(chunks, { type: 'audio/webm' }));
        recorder.start();
        setTimeout(() => { if (recorder.state !== 'inactive') recorder.stop(); }, durationMs);
      });
    }

    async function runCaptureLoop() {
      const statusEl = document.getElementById('statusText');
      const inputEl = document.getElementById('promptInput');
      recordLoopActive = true;

      while (isListening && mediaStream) {
        try {
          const blob = await recordOneChunk(mediaStream, 3500);
          if (!isListening) break;
          statusEl.textContent = 'Transcribing…';
          const text = await transcribeChunk(blob);
          if (text && text.length > 2) {
            silenceCount = 0;
            accumulatedQuestion = (accumulatedQuestion + ' ' + text).trim();
            inputEl.value = accumulatedQuestion;
            statusEl.textContent = 'Captured speech…';
          } else {
            silenceCount++;
            statusEl.textContent = 'Listening…';
            if (accumulatedQuestion && silenceCount >= 1) {
              const finalQ = accumulatedQuestion;
              accumulatedQuestion = '';
              silenceCount = 0;
              askCopilot(finalQ);
            }
          }
        } catch (err) {
          statusEl.textContent = `Mic sync retry: ${err.message}`;
          await new Promise((r) => setTimeout(r, 2000));
        }
      }
      recordLoopActive = false;
    }

    document.getElementById('listenBtn').addEventListener('click', async () => {
      const btn = document.getElementById('listenBtn');
      const statusEl = document.getElementById('statusText');

      if (isListening) {
        isListening = false;
        if (mediaStream) {
          mediaStream.getTracks().forEach((t) => t.stop());
          mediaStream = null;
        }
        btn.textContent = '🎤 Listen';
        btn.classList.remove('listening');
        statusEl.textContent = 'Paused.';
        return;
      }

      try {
        statusEl.textContent = 'Opening mic…';
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        isListening = true;
        accumulatedQuestion = '';
        silenceCount = 0;
        btn.textContent = '⏹ Stop';
        btn.classList.add('listening');
        statusEl.textContent = 'Listening continuously…';
        if (!recordLoopActive) runCaptureLoop();
      } catch (err) {
        statusEl.textContent = `Mic error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
