<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PitchPilot Stealth HUD</title>
  <style>
    :root {
      --bg-opacity: 0.92;
      --font-size: 13.5px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      color: #f8fafc;
      overflow: hidden;
      user-select: none;
    }
    #hud {
      width: 100vw;
      height: 100vh;
      background: rgba(10, 15, 28, var(--bg-opacity));
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
    }
    #titlebar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(51, 65, 85, 0.65);
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #38bdf8;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .controls {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    button.ctrl-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(71, 85, 105, 0.7);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
    }
    button.ctrl-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #fff;
    }
    button.ctrl-btn.active {
      background: rgba(16, 185, 129, 0.25);
      border-color: #10b981;
      color: #6ee7b7;
    }
    button#closeBtn:hover {
      background: rgba(239, 68, 68, 0.35);
      border-color: #ef4444;
      color: #fca5a5;
    }
    #inputRow {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.45);
    }
    #promptInput {
      flex: 1;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(71, 85, 105, 0.8);
      border-radius: 8px;
      color: #f8fafc;
      padding: 7px 10px;
      font-size: 12.5px;
      outline: none;
    }
    #promptInput:focus { border-color: #38bdf8; }
    #askBtn {
      background: linear-gradient(135deg, #2563eb, #0284c7);
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    #listenBtn {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(71, 85, 105, 0.85);
      color: #e2e8f0;
      font-weight: 600;
      font-size: 12px;
      padding: 0 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #listenBtn.listening {
      background: rgba(220, 38, 38, 0.25);
      border-color: #ef4444;
      color: #fca5a5;
    }
    #meterWrap {
      height: 4px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      overflow: hidden;
    }
    #meterBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #38bdf8);
      transition: width 0.08s linear;
    }
    #content {
      -webkit-app-region: no-drag;
      flex: 1;
      padding: 12px 14px;
      overflow-y: auto;
      font-size: var(--font-size);
      line-height: 1.55;
      color: #f1f5f9;
      user-select: text;
    }
    .question-tag {
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px dashed rgba(56, 189, 248, 0.3);
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #34d399;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    .bullet-list { padding-left: 16px; margin-top: 4px; }
    .bullet-list li { margin-bottom: 5px; }
    .placeholder { color: #94a3b8; font-size: 12.5px; line-height: 1.6; }
    #footer {
      padding: 5px 12px;
      background: rgba(15, 23, 42, 0.85);
      border-top: 1px solid rgba(51, 65, 85, 0.55);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="titlebar">
      <div class="brand">
        <span class="dot"></span>
        <span>PitchPilot HUD</span>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="fontDown" title="Decrease font">A-</button>
        <button class="ctrl-btn" id="fontUp" title="Increase font">A+</button>
        <button class="ctrl-btn" id="resizeBtn" title="Toggle compact/wide">Wide</button>
        <button class="ctrl-btn" id="opacityBtn" title="Cycle opacity">◐ 92%</button>
        <button class="ctrl-btn" id="scrollLockBtn" title="Pause auto-scroll">VS</button>
        <button class="ctrl-btn" id="clearBtn" title="Clear screen">Clear</button>
        <button class="ctrl-btn" id="hideBtn" title="Hide HUD (Ctrl+Shift+H)">—</button>
        <button class="ctrl-btn" id="closeBtn" title="Quit PitchPilot HUD completely">✕</button>
      </div>
    </div>

    <div id="inputRow">
      <button id="listenBtn">🎤 Listen</button>
      <input id="promptInput" type="text" placeholder="Live Teams audio or type question..." />
      <button id="askBtn">Ask AI</button>
    </div>

    <div id="meterWrap"><div id="meterBar"></div></div>

    <div id="content">
      <div class="placeholder">
        <strong>Stealth HUD Ready (Fast Mode).</strong><br /><br />
        • Click <strong>🎤 Listen</strong> to capture Windows system audio directly.<br />
        • Or type any question above and press <strong>Enter</strong>.<br />
        • Click <strong>—</strong> to hide (<strong>Ctrl+Shift+H</strong>) or <strong>✕</strong> to quit completely.
      </div>
    </div>

    <div id="footer">
      <span id="statusText">Ready • Stealth Protected</span>
      <span>Ctrl+Shift+H Hide • Ctrl+Alt+Arrows Move</span>
    </div>
  </div>

  <script>
    const API_BASE = 'https://pitchpilot-ai-ruddy.vercel.app';
    let fontSize = 13.5;
    let opacities = [0.92, 0.72, 0.50, 0.98];
    let opacityIdx = 0;
    let isWide = false;
    let autoScroll = true;

    // Persist auth token & context across restarts
    let authToken = localStorage.getItem('pp_token') || null;
    let resumeText = localStorage.getItem('pp_resume') || '';
    let jobDescription = localStorage.getItem('pp_jd') || '';

    // Fast 8kHz WAV PCM System Audio Capture State
    let isListening = false;
    let displayStream = null;
    let audioCtx = null;
    let processorNode = null;
    let pcmChunks = [];
    let pcmSampleCount = 0;
    let captureTimer = null;
    let accumulatedQuestion = '';
    let silenceCount = 0;

    // Filter <noise>, [music], (silence), and short filler sounds
    const FILLER_REGEX = /^(<[^>]+>|\[[^\]]+\]|\([^\)]+\)|oh|ah|uh|um|hmm|yeah|yes|no|okay|ok|right|sure|thanks|thank you)\.?$/i;
    const contentEl = document.getElementById('content');
    const statusEl = document.getElementById('statusText');
    const promptInput = document.getElementById('promptInput');
    const meterBar = document.getElementById('meterBar');

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderAnswer(payload) {
      const q = payload.question ? `<div class="question-tag">Q: ${escapeHtml(payload.question)}</div>` : '';
      let html = q;
      if (payload.overview || payload.answer) {
        html += `<div class="section-title">Direct Answer</div><div>${escapeHtml(payload.overview || payload.answer)}</div>`;
      }
      if (payload.starStory) {
        html += `<div class="section-title">STAR Example</div><div>${escapeHtml(payload.starStory)}</div>`;
      }
      if (Array.isArray(payload.bullets) && payload.bullets.length) {
        html += `<div class="section-title">Key Talking Points</div><ul class="bullet-list">${payload.bullets
          .map((b) => `<li>${escapeHtml(b)}</li>`)
          .join('')}</ul>`;
      }
      if (payload.error) {
        html += `<div style="color:#f87171;margin-top:8px;">Error: ${escapeHtml(payload.error)}</div>`;
      }
      contentEl.innerHTML = html || '<div class="placeholder">Waiting for response...</div>';
      if (autoScroll) contentEl.scrollTop = 0;
    }

    if (window.stealthHUD) {
      window.stealthHUD.onPayload((data) => {
        if (data.token) {
          authToken = data.token;
          localStorage.setItem('pp_token', authToken);
          statusEl.textContent = 'Account token synced';
        }
        if (data.resumeText) {
          resumeText = data.resumeText;
          localStorage.setItem('pp_resume', resumeText);
        }
        if (data.jobDescription) {
          jobDescription = data.jobDescription;
          localStorage.setItem('pp_jd', jobDescription);
        }
        if (data.question || data.answer || data.overview || data.bullets || data.error) {
          renderAnswer(data);
          statusEl.textContent = 'Live answer updated';
        }
      });
    }

    async function askCopilot(questionText) {
      const q = (questionText || promptInput.value || '').trim();
      if (!q || FILLER_REGEX.test(q)) return;

      statusEl.textContent = 'Generating fast AI response…';
      contentEl.innerHTML = `<div class="question-tag">Q: ${escapeHtml(q)}</div><div class="placeholder">Thinking…</div>`;

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

        const res = await fetch(`${API_BASE}/api/copilot/answer`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ question: q, resumeText, jobDescription }),
        });

        const data = await res.json();
        if (!res.ok) {
          const errMsg = data.error || `Server error (${res.status})`;
          renderAnswer({ question: q, error: errMsg });
          statusEl.textContent = res.status === 401
            ? 'Token expired — click Start Live Copilot in Chrome'
            : `Answer error (${res.status})`;
          return;
        }
        renderAnswer({ question: q, ...data });
        statusEl.textContent = 'Answer ready';
      } catch (err) {
        renderAnswer({ question: q, error: err.message });
        statusEl.textContent = 'Network error';
      }
    }

    // Downsample Float32 PCM to 8kHz Mono WAV Blob (~32 KB per 2s chunk for ultra-fast upload)
    function encodeWav8k(float32Buffers, totalSamples, inputSampleRate) {
      const targetRate = 8000;
      const ratio = inputSampleRate / targetRate;
      const outLength = Math.floor(totalSamples / ratio);
      const pcm16 = new Int16Array(outLength);

      let srcIdx = 0;
      let bufIdx = 0;

      for (let i = 0; i < outLength; i++) {
        const targetPos = Math.floor(i * ratio);
        while (bufIdx < float32Buffers.length && srcIdx + float32Buffers[bufIdx].length <= targetPos) {
          srcIdx += float32Buffers[bufIdx].length;
          bufIdx++;
        }
        if (bufIdx < float32Buffers.length) {
          const offsetInBuf = targetPos - srcIdx;
          const s = Math.max(-1, Math.min(1, float32Buffers[bufIdx][offsetInBuf]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
      }

      const wavBuffer = new ArrayBuffer(44 + pcm16.byteLength);
      const view = new DataView(wavBuffer);
      const writeStr = (off, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
      };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + pcm16.byteLength, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, targetRate, true);
      view.setUint32(28, targetRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, pcm16.byteLength, true);

      new Uint8Array(wavBuffer, 44).set(new Uint8Array(pcm16.buffer));
      return new Blob([wavBuffer], { type: 'audio/wav' });
    }

    async function flushAndTranscribe() {
      if (!isListening || pcmSampleCount === 0) return;

      const buffers = pcmChunks;
      const samples = pcmSampleCount;
      const sampleRate = audioCtx ? audioCtx.sampleRate : 48000;
      pcmChunks = [];
      pcmSampleCount = 0;

      let sumSq = 0;
      let count = 0;
      for (const b of buffers) {
        for (let i = 0; i < b.length; i += 10) {
          sumSq += b[i] * b[i];
          count++;
        }
      }
      const rms = count ? Math.sqrt(sumSq / count) : 0;
      if (rms < 0.0025) {
        silenceCount++;
        statusEl.textContent = 'Listening (silence)…';
        if (accumulatedQuestion && silenceCount >= 1) {
          const finalQ = accumulatedQuestion;
          accumulatedQuestion = '';
          silenceCount = 0;
          askCopilot(finalQ);
        }
        return;
      }

      const wavBlob = encodeWav8k(buffers, samples, sampleRate);
      const kb = Math.max(1, Math.round(wavBlob.size / 1024));
      statusEl.textContent = `Transcribing (${kb} KB)…`;

      const formData = new FormData();
      formData.append('audio', wavBlob, 'speech.wav');

      const headers = {};
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

      try {
        const res = await fetch(`${API_BASE}/api/copilot/transcribe`, {
          method: 'POST',
          headers,
          body: formData,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          statusEl.textContent = `Transcribe error: ${data.error || res.status}`;
          return;
        }

        const rawText = (data.text || '').replace(/<[^>]+>|\[[^\]]+\]/g, '').trim();
        statusEl.textContent = rawText ? `Heard: "${rawText}"` : 'Listening…';

        if (rawText && rawText.length >= 2 && !FILLER_REGEX.test(rawText)) {
          silenceCount = 0;
          accumulatedQuestion = (accumulatedQuestion + ' ' + rawText).trim();
          promptInput.value = accumulatedQuestion;

          const wordCount = accumulatedQuestion.split(/\s+/).length;
          if (accumulatedQuestion.endsWith('?') || wordCount >= 9) {
            const finalQ = accumulatedQuestion;
            accumulatedQuestion = '';
            silenceCount = 0;
            askCopilot(finalQ);
          }
        } else {
          silenceCount++;
          if (accumulatedQuestion && silenceCount >= 1) {
            const finalQ = accumulatedQuestion;
            accumulatedQuestion = '';
            silenceCount = 0;
            askCopilot(finalQ);
          }
        }
      } catch (err) {
        statusEl.textContent = `Network error: ${err.message}`;
      }
    }

    function stopSystemAudio() {
      isListening = false;
      if (captureTimer) {
        clearInterval(captureTimer);
        captureTimer = null;
      }
      meterBar.style.width = '0%';
      if (processorNode) {
        processorNode.disconnect();
        processorNode = null;
      }
      if (audioCtx) {
        audioCtx.close().catch(() => {});
        audioCtx = null;
      }
      if (displayStream) {
        displayStream.getTracks().forEach((t) => t.stop());
        displayStream = null;
      }
      pcmChunks = [];
      pcmSampleCount = 0;
    }

    document.getElementById('listenBtn').addEventListener('click', async () => {
      const btn = document.getElementById('listenBtn');
      if (isListening) {
        stopSystemAudio();
        btn.textContent = '🎤 Listen';
        btn.classList.remove('listening');
        statusEl.textContent = 'Paused.';
        return;
      }

      try {
        statusEl.textContent = 'Connecting system audio…';
        displayStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true,
        });

        displayStream.getVideoTracks().forEach((t) => t.stop());
        const audioTracks = displayStream.getAudioTracks();
        if (!audioTracks.length) {
          throw new Error('No system audio track found.');
        }

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();
        const source = audioCtx.createMediaStreamSource(new MediaStream(audioTracks));
        processorNode = audioCtx.createScriptProcessor(4096, 1, 1);

        processorNode.onaudioprocess = (e) => {
          if (!isListening) return;
          const input = e.inputBuffer.getChannelData(0);
          const copy = new Float32Array(input.length);
          let peak = 0;
          for (let i = 0; i < input.length; i++) {
            copy[i] = input[i];
            const abs = Math.abs(input[i]);
            if (abs > peak) peak = abs;
          }
          pcmChunks.push(copy);
          pcmSampleCount += copy.length;
          meterBar.style.width = `${Math.min(100, Math.round(peak * 350))}%`;
        };

        source.connect(processorNode);
        processorNode.connect(audioCtx.destination);

        isListening = true;
        accumulatedQuestion = '';
        silenceCount = 0;
        btn.textContent = '⏹ Stop';
        btn.classList.add('listening');
        statusEl.textContent = 'Listening to Teams audio…';

        captureTimer = setInterval(flushAndTranscribe, 2000);
      } catch (err) {
        stopSystemAudio();
        statusEl.textContent = `System audio error: ${err.message}`;
      }
    });

    document.getElementById('askBtn').addEventListener('click', () => askCopilot());
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') askCopilot();
    });

    document.getElementById('fontUp').addEventListener('click', () => {
      fontSize = Math.min(20, fontSize + 1);
      document.documentElement.style.setProperty('--font-size', `${fontSize}px`);
    });
    document.getElementById('fontDown').addEventListener('click', () => {
      fontSize = Math.max(11, fontSize - 1);
      document.documentElement.style.setProperty('--font-size', `${fontSize}px`);
    });
    document.getElementById('opacityBtn').addEventListener('click', (e) => {
      opacityIdx = (opacityIdx + 1) % opacities.length;
      const val = opacities[opacityIdx];
      document.documentElement.style.setProperty('--bg-opacity', val);
      e.target.textContent = `◐ ${Math.round(val * 100)}%`;
    });
    document.getElementById('resizeBtn').addEventListener('click', (e) => {
      isWide = !isWide;
      e.target.textContent = isWide ? 'Compact' : 'Wide';
      if (window.stealthHUD) {
        window.stealthHUD.resizeHUD(isWide ? 620 : 440, isWide ? 420 : 320);
      }
    });
    document.getElementById('scrollLockBtn').addEventListener('click', (e) => {
      autoScroll = !autoScroll;
      e.target.classList.toggle('active', !autoScroll);
      e.target.textContent = autoScroll ? 'VS' : 'Paused';
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      accumulatedQuestion = '';
      promptInput.value = '';
      contentEl.innerHTML = '<div class="placeholder">Screen cleared. Ready for next question.</div>';
      statusEl.textContent = 'Cleared';
    });
    document.getElementById('hideBtn').addEventListener('click', () => {
      if (window.stealthHUD) window.stealthHUD.toggleVisibility();
    });
    document.getElementById('closeBtn').addEventListener('click', () => {
      stopSystemAudio();
      if (window.stealthHUD && window.stealthHUD.quitApp) {
        window.stealthHUD.quitApp();
      } else {
        window.close();
      }
    });
  </script>
</body>
</html>
