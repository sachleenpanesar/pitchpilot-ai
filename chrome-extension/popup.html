<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>PitchPilot AI</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <div class="brand-copy">
          <strong>PitchPilot AI</strong>
          <span>Meeting & interview copilot</span>
        </div>
        <button id="settings-toggle" class="icon-button" type="button" aria-label="Settings" aria-expanded="false" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .8v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.8l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.8-3H4a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .8-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.8V2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .8l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .8 3h.2a1.8 1.8 0 0 1 0 3.6H20a1.8 1.8 0 0 0-.6 2.9Z"/></svg>
        </button>
      </header>

      <section class="credit-row" aria-live="polite">
        <div>
          <span class="eyebrow">YOUR ACCOUNT</span>
          <strong id="credit-badge" class="credit-badge">Connect token</strong>
        </div>
        <a id="upgrade-link" class="upgrade-link" href="#">Upgrade <span aria-hidden="true">↗</span></a>
      </section>

      <button id="open-panel" class="open-panel" type="button">
        <span class="open-icon" aria-hidden="true">↗</span>
        <span><strong>Open Full Side Panel</strong><small>Prepare a session and start your copilot</small></span>
      </button>

      <nav class="quick-links" aria-label="Quick links">
        <a id="support-link" href="#">Support</a>
        <button id="connect-account" class="quick-link-button" type="button">Connect account</button>
      </nav>

      <section id="settings-panel" class="settings-panel" hidden>
        <div class="settings-heading">
          <div>
            <span class="eyebrow">CONNECTION</span>
            <h2>Settings</h2>
          </div>
          <button id="settings-close" class="close-button" type="button" aria-label="Close settings">×</button>
        </div>
        <label for="backend-origin">Backend URL</label>
        <input id="backend-origin" type="url" autocomplete="url" spellcheck="false">
        <label for="extension-token">30-day extension token</label>
        <input id="extension-token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste token from Extension Access">
        <a id="manual-token-link" class="manual-token-link" href="#">Get a token manually</a>
        <label class="remember-row" for="remember-token">
          <input id="remember-token" type="checkbox">
          <span>Remember token on this device</span>
        </label>
        <p class="settings-hint">Tokens are session-only by default. Remembered tokens are stored in Chrome profile storage.</p>
        <button id="save-settings" class="save-button" type="button">Save settings</button>
        <p id="settings-message" class="settings-message" role="status" aria-live="polite"></p>
      </section>

      <p class="footer">Use only where permitted. Verify AI suggestions before relying on them.</p>
    </main>
    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
